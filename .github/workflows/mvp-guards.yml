name: MVP Guards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - mvp
      - codex/semantic-platform-staging-20260719

permissions:
  contents: read

concurrency:
  group: mvp-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex-cut-guard:
    name: Convex Cut Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Run Convex cut runtime guard
        run: npm run check:convex-cut-runtime-guard

      - name: Run no legacy provider repo guard
        run: npm run check:no-legacy-provider-repo-guard

      - name: Run legacy route surface guard
        run: npm run check:legacy-route-surface-guard

      - name: Run no compat RPC primitive guard
        run: npm run check:no-compat-rpc-primitive-guard

      - name: Run auth env contract guard
        run: npm run check:auth-env-contract-guard

      - name: Run no direct legacy-auth imports guard
        run: npm run check:no-direct-legacy-auth-imports-guard

      - name: Run legacy function transport surface guard
        run: npm run check:legacy-function-transport-surface-guard

      - name: Run Convex client surface guard
        run: npm run check:convex-client-surface-guard

      - name: Run Convex verified identity guard
        run: npm run check:convex-verified-identity-guard

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify package deployment boundaries
        run: npm run check:package-deployment-boundary-contract

      - name: Install root dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=low

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Audit web dependencies
        run: npm --prefix apps/web audit --audit-level=low

      - name: Install preview proxy dependencies
        run: npm --prefix apps/preview-proxy ci

      - name: Audit preview proxy dependencies
        run: npm --prefix apps/preview-proxy audit --audit-level=low

  foundation-baseline:
    name: Foundation Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Run foundation baseline gate (canonical)
        run: bash scripts/foundation_baseline_gate.sh

      - name: Typecheck web product
        run: npm run check:web-typecheck

      - name: Build web product
        run: npm run build

      - name: Enforce web bundle budget
        run: npm run check:web-bundle-budget
