name: Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    # Pinned: ubuntu-latest now resolves to 26.04, where Playwright 1.58.2
    # can't install Chromium, so the gate died before any check ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install community edge dependencies
        # The root suite runs infra/community-edge tests, which import the
        # edge's own locked convex browser bundle.
        run: npm --prefix infra/community-edge ci

      - name: Install matching Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical release gate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: npm run release:gate -- --mode=ci --sha="$CANDIDATE_SHA" --evidence=artifacts/release-gate.json

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.sha }}
          path: |
            artifacts/release-gate.json
            artifacts/media-reading/
          if-no-files-found: warn
          retention-days: 30
