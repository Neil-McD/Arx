name: Release Gate

# Fast, parallel pull-request gate:
# - 3 parallel jobs: Typecheck & build, Tests & invariants, Browser checks (pre-baked container)
# - "Release Gate" aggregates all 3 under the required branch status check name
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix apps/web ci

      - name: Convex & web typecheck
        run: |
          npx tsc --noEmit -p convex/tsconfig.json --pretty false
          npm run check:web-typecheck

      - name: Production web build & bundle budget
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          POLYNET_RELEASE_GATE_BUILD_ID: ${{ github.sha }}
        run: npm run build && npm run check:web-bundle-budget

  tests-and-invariants:
    name: Tests & invariants
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix apps/web ci

      - name: Run unit and behavior tests
        run: npm run test:unit

      - name: Run security, auth, billing, and runtime invariants
        run: npm run check:invariants

      - name: Dependency security checks
        run: |
          npm run check:dependency-security-interlock
          node scripts/dependency_audit_check.mjs
          node scripts/dependency_audit_check.mjs --prefix apps/web

  browser-checks:
    name: Browser checks
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci && npm --prefix apps/web ci

      - name: Loading correctness & media reading browser tests
        run: |
          npm run check:loading-correctness
          npm run check:media-reading-browser-proof

  release-gate:
    name: Release Gate
    if: always()
    needs:
      - typecheck-and-build
      - tests-and-invariants
      - browser-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify all required checks passed
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck-and-build.result }}
          TESTS_RESULT: ${{ needs.tests-and-invariants.result }}
          BROWSER_RESULT: ${{ needs.browser-checks.result }}
        run: |
          if [ "$TYPECHECK_RESULT" != "success" ] || [ "$TESTS_RESULT" != "success" ] || [ "$BROWSER_RESULT" != "success" ]; then
            echo "FAIL: Release Gate failed (typecheck=$TYPECHECK_RESULT, tests=$TESTS_RESULT, browser=$BROWSER_RESULT)"
            exit 1
          fi
          echo "PASS: Release Gate succeeded."
