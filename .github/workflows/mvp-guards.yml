name: MVP Guards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - mvp

permissions:
  contents: read

concurrency:
  group: mvp-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-baseline:
    name: Foundation Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Supabase CLI (pinned contract line)
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Run foundation baseline gate (canonical)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/foundation_baseline_gate.sh

  reliability-smoke:
    name: Reliability Smoke
    runs-on: ubuntu-latest
    needs:
      - foundation-baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Run reliability smoke gate
        run: bash scripts/reliability_smoke_gate.sh
