name: Release Gate

# Runs on pull requests only. A merge to main is not gated again: the pull
# request already passed, and `npm run release:prod` runs the same gate before
# anything reaches production. Run it by hand on any ref with workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    # Where the gate runs is a repository variable, so it can move without a
    # code change: set CI_RUNS_ON to another runner label that is Ubuntu 24.04
    # (for example ubicloud-standard-2-ubuntu-2404) and delete it to come back.
    # Pinned to 24.04: ubuntu-latest moved to 26.04 (Nov 14), which the gate's
    # Playwright Chromium does not support yet.
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install matching Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical release gate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: npm run release:gate -- --mode=ci --sha="$CANDIDATE_SHA" --evidence=artifacts/release-gate.json

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.sha }}
          path: |
            artifacts/release-gate.json
            artifacts/media-reading/
          if-no-files-found: warn
          retention-days: 30
