app = "polynet-preview-proxy"
# Co-located with the worker (sjc) and Blaxel sandboxes (us-pdx-1): previews
# were doing coast-to-coast round trips from iad.
primary_region = "sjc"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # 256MB is suspend-eligible: scale-to-zero like the rest of the stack,
  # ~0.3s wake on the first preview after idle.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
