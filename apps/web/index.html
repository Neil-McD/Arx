<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Polynet" />
    <meta name="theme-color" content="#1A1A1A" />
    <script data-theme-bootstrap>
      (() => {
        const themes = {
          dark: { browserColor: "#1A1A1A" },
          light: { browserColor: "#F8F8F4" },
        };
        const legacyThemeAliases = { cris: "light" };
        const fallbackTheme = "dark";
        let theme = fallbackTheme;
        try {
          const storedTheme = (
            localStorage.getItem("polynet-theme") ??
            localStorage.getItem("arx-theme") ??
            ""
          ).trim();
          const canonicalStoredTheme = Object.prototype.hasOwnProperty.call(
            legacyThemeAliases,
            storedTheme,
          )
            ? legacyThemeAliases[storedTheme]
            : storedTheme;
          if (Object.prototype.hasOwnProperty.call(themes, canonicalStoredTheme)) {
            theme = canonicalStoredTheme;
          }
        } catch {
          // Storage can be unavailable in hardened browser contexts.
        }
        const definition = themes[theme];
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", definition.browserColor);
      })();
    </script>
    <script data-community-boot-look>
      // A community's page opens in its own colours (communityBootLook.ts
      // keeps them after a visit); the real theme replaces them once loaded.
      (() => {
        try {
          const match = /^\/c\/([^/?#]+)/.exec(location.pathname);
          if (!match) return;
          const look = JSON.parse(localStorage.getItem("polynet-boot-look:" + decodeURIComponent(match[1])) || "null");
          if (!look || look.v !== 1 || !look.vars) return;
          const root = document.documentElement;
          const names = [];
          for (const [name, value] of Object.entries(look.vars)) {
            if (!/^--[\w-]+$/.test(name) || typeof value !== "string") continue;
            root.style.setProperty(name, value);
            names.push(name);
          }
          root.setAttribute("data-boot-look", names.join(" "));
          const background = look.vars["--bg-workspace"];
          if (background) {
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", background);
          }
        } catch {
          // No saved look, or storage is blocked: Polynet's own look loads.
        }
      })();
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=20260811a" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=20260425a" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=20260425a" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png?v=20260425a" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png?v=20260425a" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%favicon.png?v=20260425a" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=20260425a" />
    <title>Polynet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
