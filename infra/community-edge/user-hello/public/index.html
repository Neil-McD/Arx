<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Community</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; --line: #8883; --soft: #8881; --accent: #7c5cff; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    a.button { color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    .live { font-size: 12px; opacity: .7; }
    main { display: grid; grid-template-columns: 180px 1fr; height: calc(100dvh - 53px); }
    main.thread-open { grid-template-columns: 180px 1fr 340px; }
    nav { border-right: 1px solid var(--line); padding: 12px 8px; }
    nav button { display: block; width: 100%; text-align: left; border: 0; margin-bottom: 2px; }
    nav button.active { background: var(--soft); font-weight: 600; }
    section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #thread { border-left: 1px solid var(--line); }
    .pane-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
    ol { list-style: none; margin: 0; padding: 8px 16px; flex: 1; overflow-y: auto; min-height: 0; }
    .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .files img { max-width: min(320px, 100%); max-height: 240px; border-radius: 8px; display: block; }
    .files a { font-size: 13px; }
    label.attach { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    label.attach input { display: none; }
    .pending { font-size: 12px; opacity: .7; padding: 0 16px; }
    li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 10px 0; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); object-fit: cover; }
    .who { font-weight: 600; margin-right: 6px; }
    .meta { opacity: .6; font-size: 12px; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .row button { padding: 2px 8px; font-size: 13px; }
    .row button.mine { border-color: var(--accent); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font: inherit; background: none; color: inherit; }
    .notice { padding: 48px 16px; text-align: center; max-width: 480px; margin: 0 auto; }
    .notice .row { justify-content: center; margin-top: 16px; }
    @media (max-width: 720px) {
      main, main.thread-open { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; }
      nav button { width: auto; white-space: nowrap; }
      main.thread-open #channel { display: none; }
      #thread { border-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Community</h1>
    <span class="live" id="live"></span>
    <a class="button" id="signin" href="/__polynet/auth/start?return=/" hidden>Sign in with Polynet</a>
    <button id="signout" hidden>Sign out</button>
  </header>
  <div class="notice" id="signedOut" hidden>
    <p>Sign in with your Polynet account to join the conversation.</p>
    <div class="row"><a class="button" href="/__polynet/auth/start?return=/">Sign in with Polynet</a><a class="button joinLink" target="_blank" rel="noopener">New here? Join</a></div>
  </div>
  <div class="notice" id="joinNeeded" hidden>
    <p>Your Polynet account isn't a member of this community yet. Join on Polynet, then come back and sign in.</p>
    <div class="row"><a class="button joinLink" target="_blank" rel="noopener">Join on Polynet</a><a class="button" href="/__polynet/auth/start?return=/">I've joined, sign in</a></div>
  </div>
  <main id="app" hidden>
    <nav id="channels"></nav>
    <section id="channel">
      <div class="pane-head"><span id="channelName"></span></div>
      <ol id="feed"></ol>
      <div class="pending" id="pending"></div>
      <form id="composer"><label class="attach" title="Attach files">📎<input id="files" type="file" multiple /></label><input id="text" placeholder="Message" autocomplete="off" /><button>Send</button></form>
    </section>
    <section id="thread" hidden>
      <div class="pane-head"><span>Thread</span><button id="closeThread">Close</button></div>
      <ol id="threadFeed"></ol>
      <div class="pending" id="replyPending"></div>
      <form id="replyComposer"><label class="attach" title="Attach files">📎<input id="replyFiles" type="file" multiple /></label><input id="replyText" placeholder="Reply" autocomplete="off" /><button>Reply</button></form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/convex@1.42.1/dist/browser.bundle.js"></script>
  <script>
    // A Polynet community front end, built only on the door at /__polynet/api
    // (list, read, write, call). This domain's Polynet edge adds the member
    // session from an HttpOnly cookie. Live updates: subscribe to a watch-only
    // signal for the open channel and re-read through the door when it changes.
    const COMMUNITY = "/communities/polynet";
    const REACTIONS = ["👍", "❤️", "😂"];
    const $ = (id) => document.getElementById(id);
    const state = { live: null, client: null, unwatch: null, channel: null, thread: null };

    async function door(tool, input) {
      const res = await fetch("/__polynet/api", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tool, input }),
      });
      if (res.status === 401) { await refresh(); return null; }
      const body = await res.json();
      if (!body.ok) console.warn(tool, body.code, body.message);
      return body.ok ? body.value : null;
    }
    const key = () => crypto.randomUUID();
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    function messageItem(entry, { inThread }) {
      const actor = entry.actor ?? {};
      const name = actor.display_name ?? actor.handle ?? (actor.type === "community_agent" ? "Community agent" : "Member");
      const avatar = el("img", { className: "avatar", alt: "", src: actor.avatar_url ?? "" });
      if (!actor.avatar_url) avatar.removeAttribute("src");
      const meta = el("span", { className: "meta",
        textContent: `${new Date(entry.created_at).toLocaleString()}${entry.edited_at ? " · edited" : ""}` });
      const text = el("div", { className: "text", textContent: entry.snippet ?? "" });
      const files = el("div", { className: "files" }, ...(entry.attachments ?? []).map((file) => {
        const src = `/__polynet/files/${file.ref.replace("attachment:", "")}`;
        return file.kind === "image"
          ? el("a", { href: src, target: "_blank", rel: "noopener" }, el("img", { src, alt: file.name, loading: "lazy" }))
          : el("a", { href: src, textContent: `📄 ${file.name}` });
      }));
      const row = el("div", { className: "row" });
      const counts = new Map((entry.reactions ?? []).map((r) => [r.emoji, r.count]));
      for (const emoji of new Set([...REACTIONS, ...counts.keys()])) {
        const mine = (entry.reacted_by_me ?? []).includes(emoji);
        const count = counts.get(emoji) ?? 0;
        const button = el("button", { className: mine ? "mine" : "", textContent: count ? `${emoji} ${count}` : emoji });
        button.onclick = () => door("polynet_call", {
          target: `${COMMUNITY}/capabilities/community.interaction.react.json`, operation: "community.interaction.react",
          version: 1, idempotencyKey: key(), input: { ref: entry.ref, emoji, on: !mine },
        });
        row.append(button);
      }
      if (!inThread && entry.object_type === "root") {
        const replies = el("button", { textContent: entry.reply_count ? `${entry.reply_count} replies` : "Reply" });
        replies.onclick = () => openThread(entry);
        row.append(replies);
      }
      if (entry.by_me) {
        const edit = el("button", { textContent: "Edit" });
        edit.onclick = async () => {
          const next = prompt("Edit message", entry.snippet ?? "");
          if (next && next.trim()) await door("polynet_write", { path: entry.path, mode: "update", content: { text: next.trim() }, idempotency_key: key() });
        };
        const remove = el("button", { textContent: "Delete" });
        remove.onclick = async () => {
          await door("polynet_write", { path: entry.path, mode: "delete", content: {}, idempotency_key: key() });
          if (state.thread?.ref === entry.ref) closeThread();
        };
        row.append(edit, remove);
      }
      return el("li", {}, avatar, el("div", {}, el("span", { className: "who", textContent: name }), meta, text, files, row));
    }

    async function loadFeed() {
      if (!state.channel) return;
      const value = await door("polynet_list", { path: state.channel.path, limit: 50 });
      if (!value) return;
      const roots = (value.entries ?? []).filter((entry) => entry.object_type === "root").reverse();
      $("feed").replaceChildren(...roots.map((entry) => messageItem(entry, { inThread: false })));
      $("feed").scrollTop = $("feed").scrollHeight;
    }

    async function loadThread() {
      if (!state.thread) return;
      const value = await door("polynet_list", { path: `${state.channel.path}${state.thread.ref}/` });
      if (!value) { closeThread(); return; }
      $("threadFeed").replaceChildren(...(value.entries ?? []).map((entry) => messageItem(entry, { inThread: true })));
    }

    function openThread(entry) {
      state.thread = entry;
      $("thread").hidden = false;
      $("app").classList.add("thread-open");
      loadThread();
    }

    function closeThread() {
      state.thread = null;
      $("thread").hidden = true;
      $("app").classList.remove("thread-open");
    }

    function watchChannel() {
      state.unwatch?.();
      state.unwatch = state.client.onUpdate("communityLive:watch", { token: state.live.token, path: state.channel.path }, (result) => {
        if (result?.ok) { $("live").textContent = "● live"; loadFeed(); loadThread(); }
        else { $("live").textContent = ""; if (result?.code === "session_invalid") refresh(); }
      });
    }

    function selectChannel(channel) {
      state.channel = channel;
      closeThread();
      $("channelName").textContent = `# ${channel.name}`;
      $("text").placeholder = `Message #${channel.name}`;
      for (const button of $("channels").children) button.classList.toggle("active", button.dataset.path === channel.path);
      $("composer").hidden = channel.capabilities?.canPost === false;
      watchChannel();
    }

    async function loadChannels() {
      const value = await door("polynet_list", { path: `${COMMUNITY}/channels/` });
      const channels = (value?.entries ?? []).filter((entry) => entry.type === "channel");
      $("channels").replaceChildren(...channels.map((channel) => {
        const button = el("button", { textContent: `# ${channel.name}` });
        button.dataset.path = channel.path;
        button.onclick = () => selectChannel(channel);
        return button;
      }));
      const current = channels.find((channel) => channel.path === state.channel?.path) ?? channels.find((c) => c.is_general) ?? channels[0];
      if (current) selectChannel(current);
    }

    async function refresh() {
      const session = await (await fetch("/__polynet/auth/session")).json();
      const joinNeeded = !session.signed_in && new URLSearchParams(location.search).get("polynet") === "join";
      for (const link of document.querySelectorAll(".joinLink")) link.href = session.join_url ?? "#";
      $("signin").hidden = session.signed_in || joinNeeded;
      $("signout").hidden = !session.signed_in;
      $("signedOut").hidden = session.signed_in || joinNeeded;
      $("joinNeeded").hidden = !joinNeeded;
      $("app").hidden = !session.signed_in;
      if (session.signed_in && session.live) {
        if (state.live?.token !== session.live.token) {
          state.client?.close();
          state.live = session.live;
          state.client = new convex.ConvexClient(session.live.url);
        }
        await loadChannels();
      } else {
        state.unwatch?.();
        state.client?.close();
        Object.assign(state, { live: null, client: null, unwatch: null, channel: null, thread: null });
        $("live").textContent = "";
      }
    }

    // Files upload first under the post's idempotency key; the post then claims them.
    async function upload(files, idempotencyKey, rootId, status) {
      const attachments = [];
      for (const file of files) {
        status.textContent = `Uploading ${file.name}…`;
        const res = await fetch("/__polynet/upload", {
          method: "POST",
          headers: {
            "Content-Type": file.type || "application/octet-stream",
            "x-polynet-file-name": encodeURIComponent(file.name),
            "x-polynet-channel": state.channel.slug,
            "x-polynet-idempotency-key": idempotencyKey,
            ...(rootId ? { "x-polynet-root-id": rootId } : {}),
          },
          body: file,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.attachment) { status.textContent = `Couldn't upload ${file.name}.`; return null; }
        attachments.push({ attachmentId: body.attachment.attachmentId });
      }
      status.textContent = "";
      return attachments;
    }

    async function send({ input, fileInput, status, mode, rootId }) {
      const text = input.value.trim();
      const files = [...fileInput.files];
      if (!text && !files.length) return;
      const idempotencyKey = key();
      const attachments = files.length ? await upload(files, idempotencyKey, rootId, status) : [];
      if (!attachments) return;
      input.value = "";
      fileInput.value = "";
      await door("polynet_write", {
        path: state.channel.path, mode, idempotency_key: idempotencyKey,
        content: { text, ...(rootId ? { root_id: rootId } : {}), ...(attachments.length ? { attachments } : {}) },
      });
    }

    $("composer").onsubmit = (event) => {
      event.preventDefault();
      send({ input: $("text"), fileInput: $("files"), status: $("pending"), mode: "create" });
    };
    $("replyComposer").onsubmit = (event) => {
      event.preventDefault();
      if (!state.thread) return;
      send({ input: $("replyText"), fileInput: $("replyFiles"), status: $("replyPending"), mode: "append",
        rootId: state.thread.ref.replace("interaction:root:", "") });
    };
    $("closeThread").onclick = closeThread;
    $("signout").onclick = async () => {
      await fetch("/__polynet/auth/logout", { method: "POST" });
      refresh();
    };

    refresh();
  </script>
</body>
</html>
