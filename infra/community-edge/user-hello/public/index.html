<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Community</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; --line: #8883; --soft: #8881; --accent: #7c5cff; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    a.button { color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    .live { font-size: 12px; opacity: .7; }
    main { display: grid; grid-template-columns: 180px 1fr; height: calc(100dvh - 53px); }
    main.thread-open { grid-template-columns: 180px 1fr 340px; }
    nav { border-right: 1px solid var(--line); padding: 12px 8px; }
    nav button { display: block; width: 100%; text-align: left; border: 0; margin-bottom: 2px; }
    nav button.active { background: var(--soft); font-weight: 600; }
    nav .group { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; margin: 12px 8px 4px; }
    #page .body { padding: 12px 16px; overflow-y: auto; flex: 1; min-height: 0; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 4px; font-size: 15px; }
    .card button.link { border: 0; padding: 0; text-align: left; font-weight: 600; text-decoration: underline; }
    .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; opacity: .8; }
    .doc { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .search { display: flex; gap: 8px; margin-bottom: 12px; }
    .chat { display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bubble.user { align-self: flex-end; background: var(--soft); }
    .bubble.assistant { align-self: flex-start; border: 1px solid var(--line); }
    section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #thread { border-left: 1px solid var(--line); }
    .pane-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
    ol { list-style: none; margin: 0; padding: 8px 16px; flex: 1; overflow-y: auto; min-height: 0; }
    .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .files img { max-width: min(320px, 100%); max-height: 240px; border-radius: 8px; display: block; }
    .files a { font-size: 13px; }
    label.attach { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    label.attach input { display: none; }
    .pending { font-size: 12px; opacity: .7; padding: 0 16px; }
    li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 10px 0; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); object-fit: cover; }
    .who { font-weight: 600; margin-right: 6px; }
    .meta { opacity: .6; font-size: 12px; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .row button { padding: 2px 8px; font-size: 13px; }
    .row button.mine { border-color: var(--accent); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font: inherit; background: none; color: inherit; }
    .notice { padding: 48px 16px; text-align: center; max-width: 480px; margin: 0 auto; }
    .notice .row { justify-content: center; margin-top: 16px; }
    @media (max-width: 720px) {
      main, main.thread-open { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; }
      nav button { width: auto; white-space: nowrap; }
      main.thread-open #channel { display: none; }
      #thread { border-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Community</h1>
    <span class="live" id="live"></span>
    <button id="signin" hidden>Sign in with Polynet</button>
    <button id="signout" hidden>Sign out</button>
  </header>
  <div class="notice" id="signedOut" hidden>
    <p>Sign in with your Polynet account to join the conversation.</p>
    <div class="row"><a class="button" href="/__polynet/auth/start?return=/">Sign in with Polynet</a><a class="button joinLink" target="_blank" rel="noopener">New here? Join</a></div>
  </div>
  <div class="notice" id="joinNeeded" hidden>
    <p>Your Polynet account isn't a member of this community yet. Join on Polynet, then come back and sign in.</p>
    <div class="row"><a class="button joinLink" target="_blank" rel="noopener">Join on Polynet</a><a class="button" href="/__polynet/auth/start?return=/">I've joined, sign in</a></div>
  </div>
  <main id="app" hidden>
    <nav>
      <div class="group">Channels</div>
      <div id="channels"></div>
      <div class="group">Community</div>
      <button data-page="events">Events</button>
      <button data-page="resources">Resources</button>
      <button data-page="knowledge">Knowledge</button>
      <button data-page="agent">Agent</button>
    </nav>
    <section id="channel">
      <div class="pane-head"><span id="channelName"></span></div>
      <ol id="feed"></ol>
      <div class="pending" id="pending"></div>
      <form id="composer"><label class="attach" title="Attach files">📎<input id="files" type="file" multiple /></label><button type="button" id="askAgent" title="Ask the community agent">✨</button><input id="text" placeholder="Message" autocomplete="off" /><button>Send</button></form>
    </section>
    <section id="page" hidden>
      <div class="pane-head"><span id="pageTitle"></span><button id="pageBack" hidden>Back</button></div>
      <div class="body" id="pageBody"></div>
    </section>
    <section id="thread" hidden>
      <div class="pane-head"><span>Thread</span><button id="closeThread">Close</button></div>
      <ol id="threadFeed"></ol>
      <div class="pending" id="replyPending"></div>
      <form id="replyComposer"><label class="attach" title="Attach files">📎<input id="replyFiles" type="file" multiple /></label><input id="replyText" placeholder="Reply" autocomplete="off" /><button>Reply</button></form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/co  <script type="module">
    // A Polynet community front end built only on the SDK. See /__polynet/llms.txt.
    import polynet from "/__polynet/sdk.js";

    const REACTIONS = ["👍", "❤️", "😂"];
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };
    const state = { session: null, community: null, channel: null, thread: null, stopWatch: null, back: null, askAgent: false };
    const fail = (error) => {
      console.warn(error);
      if (error?.code === "sign_in_required") refresh();
    };

    function authorName(actor = {}) {
      const member = actor.display_name ?? actor.handle;
      if (actor.type === "community_agent") {
        const agent = `${state.community?.name ?? "Community"} agent`;
        return member ? `${agent} · for ${member}` : agent;
      }
      return member ?? "Member";
    }

    function messageItem(entry, { inThread }) {
      const actor = entry.actor ?? {};
      const avatarUrl = actor.type === "community_agent" ? null : actor.avatar_url;
      const avatar = el("img", { className: "avatar", alt: "" });
      if (avatarUrl) avatar.src = avatarUrl;
      const meta = el("span", { className: "meta", textContent: `${new Date(entry.created_at).toLocaleString()}${entry.edited_at ? " · edited" : ""}` });
      const text = el("div", { className: "text", textContent: entry.snippet ?? "" });
      const files = el("div", { className: "files" }, ...(entry.attachments ?? []).map((file) => file.kind === "image"
        ? el("a", { href: polynet.fileUrl(file), target: "_blank", rel: "noopener" }, el("img", { src: polynet.fileUrl(file), alt: file.name, loading: "lazy" }))
        : el("a", { href: polynet.fileUrl(file), textContent: `📄 ${file.name}` })));
      const row = el("div", { className: "row" });
      const counts = new Map((entry.reactions ?? []).map((r) => [r.emoji, r.count]));
      for (const emoji of new Set([...REACTIONS, ...counts.keys()])) {
        const mine = (entry.reacted_by_me ?? []).includes(emoji);
        const count = counts.get(emoji) ?? 0;
        const button = el("button", { className: mine ? "mine" : "", textContent: count ? `${emoji} ${count}` : emoji });
        button.onclick = () => polynet.react(entry.ref, emoji, !mine).catch(fail);
        row.append(button);
      }
      if (!inThread) {
        const replies = el("button", { textContent: entry.reply_count ? `${entry.reply_count} replies` : "Reply" });
        replies.onclick = () => openThread(entry);
        row.append(replies);
      }
      if (entry.by_me) {
        if (actor.type === "human") {
          const edit = el("button", { textContent: "Edit" });
          edit.onclick = () => {
            const next = prompt("Edit message", entry.snippet ?? "");
            if (next && next.trim()) polynet.edit(entry, next.trim()).catch(fail);
          };
          row.append(edit);
        }
        const remove = el("button", { textContent: "Delete" });
        remove.onclick = async () => {
          await polynet.remove(entry).catch(fail);
          if (state.thread?.ref === entry.ref) closeThread();
        };
        row.append(remove);
      }
      return el("li", {}, avatar, el("div", {}, el("span", { className: "who", textContent: authorName(actor) }), meta, text, files, row));
    }

    async function loadFeed() {
      if (!state.channel) return;
      const posts = await polynet.feed(state.channel.slug).catch(fail);
      if (!posts) return;
      $("feed").replaceChildren(...posts.map((entry) => messageItem(entry, { inThread: false })));
      $("feed").scrollTop = $("feed").scrollHeight;
    }

    async function loadThread() {
      if (!state.thread) return;
      const entries = await polynet.thread(state.channel.slug, state.thread.ref).catch(() => null);
      if (!entries) { closeThread(); return; }
      $("threadFeed").replaceChildren(...entries.map((entry) => messageItem(entry, { inThread: true })));
    }

    function openThread(entry) {
      state.thread = entry;
      $("thread").hidden = false;
      $("app").classList.add("thread-open");
      loadThread();
    }

    function closeThread() {
      state.thread = null;
      $("thread").hidden = true;
      $("app").classList.remove("thread-open");
    }

    function setActive(match) {
      for (const button of document.querySelectorAll("nav button")) button.classList.toggle("active", match(button));
    }

    async function selectChannel(channel) {
      state.channel = channel;
      closeThread();
      $("page").hidden = true;
      $("channel").hidden = false;
      $("channelName").textContent = `# ${channel.name}`;
      $("text").placeholder = `Message #${channel.name}`;
      setActive((button) => button.dataset.slug === channel.slug);
      $("composer").hidden = !channel.canPost;
      state.stopWatch?.();
      // Live: re-read the channel whenever anything in it changes.
      state.stopWatch = await polynet.watch(channel.slug, () => { loadFeed(); loadThread(); }).catch((error) => { fail(error); return null; });
      $("live").textContent = state.stopWatch ? "● live" : "";
    }

    async function loadChannels() {
      const channels = await polynet.channels();
      $("channels").replaceChildren(...channels.map((channel) => {
        const button = el("button", { textContent: `# ${channel.name}` });
        button.dataset.slug = channel.slug;
        button.onclick = () => selectChannel(channel);
        return button;
      }));
      const current = channels.find((c) => c.slug === state.channel?.slug) ?? channels.find((c) => c.isGeneral) ?? channels[0];
      if (current) await selectChannel(current);
    }

    function showPage(title, children, back = null) {
      closeThread();
      $("channel").hidden = true;
      $("page").hidden = false;
      $("pageTitle").textContent = title;
      state.back = back;
      $("pageBack").hidden = !back;
      $("pageBody").replaceChildren(...children);
    }
    const empty = (text) => el("p", { className: "meta", textContent: text });

    async function openEvents() {
      const events = await polynet.events().catch(fail) ?? [];
      showPage("Events", events.length ? events.map((event) => el("div", { className: "card" },
        el("h3", { textContent: event.title ?? event.name }),
        el("div", { className: "meta", textContent: [
          new Date(event.starts_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }),
          event.location_label,
          event.recurrence_frequency && event.recurrence_frequency !== "none" ? `repeats ${event.recurrence_frequency}` : null,
        ].filter(Boolean).join(" · ") }),
        ...(event.description_md ? [el("div", { className: "doc", textContent: event.description_md })] : []),
        ...(event.url ? [el("a", { href: event.url, target: "_blank", rel: "noopener noreferrer", textContent: "Join link" })] : []),
      )) : [empty("No upcoming events.")]);
    }

    async function openDocument(entry, back) {
      const text = await polynet.readText(entry).catch(() => "This document isn't available.");
      showPage(entry.title ?? entry.name ?? "Document", [el("div", { className: "doc", textContent: text })], back);
    }

    async function openResources(entry = null) {
      const entries = await polynet.resources(entry?.path).catch(fail) ?? [];
      const title = entry ? entry.title ?? entry.name : "Resources";
      showPage(title, entries.length ? entries.map((item) => {
        const name = item.title ?? item.name ?? item.path.split("/").filter(Boolean).pop();
        const open = el("button", { className: "link", textContent: `${item.kind === "directory" ? "📁" : "📄"} ${name}` });
        open.onclick = () => item.kind === "directory" ? openResources(item) : openDocument(item, () => openResources(entry));
        return el("div", { className: "card" }, open);
      }) : [empty("No resources yet.")], entry ? () => openResources() : null);
    }

    async function openKnowledge(query = "") {
      const nodes = await polynet.knowledge(query).catch(fail) ?? [];
      const input = el("input", { placeholder: "Search what this community knows", value: query });
      const form = el("form", { className: "search" }, input, el("button", { textContent: "Search" }));
      form.onsubmit = (event) => { event.preventDefault(); openKnowledge(input.value.trim()); };
      showPage("Knowledge", [form, ...(nodes.length ? nodes.map((node) => {
        const open = el("button", { className: "link", textContent: node.title ?? "Memory" });
        open.onclick = () => openDocument(node, () => openKnowledge(query));
        return el("div", { className: "card" }, open,
          el("span", { className: "tag", textContent: String(node.type ?? "").replace(/_/g, " ") }),
          el("span", { className: "tag", textContent: node.grade ?? node.status ?? "" }),
          ...(node.applies_when ? [el("div", { className: "meta", textContent: `When: ${node.applies_when}` })] : []));
      }) : [empty(query ? "Nothing found." : "This community hasn't built shared knowledge yet.")])]);
    }

    const bubble = (role, text) => el("div", { className: `bubble ${role}`, textContent: text });

    async function openAgent() {
      const history = await polynet.agentHistory().catch(fail) ?? [];
      const chat = el("div", { className: "chat" }, ...history.map((m) => bubble(m.role, m.text)));
      const input = el("input", { placeholder: `Ask the ${state.community?.name ?? "community"} agent` });
      const form = el("form", { className: "search" }, input, el("button", { textContent: "Send" }));
      form.onsubmit = async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        chat.append(bubble("user", text));
        const answer = bubble("assistant", "…");
        chat.append(answer);
        await polynet.askAgent(text, { onDelta: (soFar) => { answer.textContent = soFar; } })
          .catch((error) => { answer.textContent = error.message; });
      };
      showPage(`${state.community?.name ?? "Community"} agent`, [chat, form]);
      input.focus();
    }

    for (const button of document.querySelectorAll("nav button[data-page]")) {
      button.onclick = () => {
        setActive((candidate) => candidate === button);
        ({ events: openEvents, resources: () => openResources(), knowledge: () => openKnowledge(), agent: openAgent })[button.dataset.page]();
      };
    }
    $("pageBack").onclick = () => state.back?.();

    async function refresh() {
      const session = await polynet.session({ refresh: true });
      state.session = session;
      const joinNeeded = !session.signed_in && new URLSearchParams(location.search).get("polynet") === "join";
      for (const link of document.querySelectorAll(".joinLink")) link.href = session.join_url ?? "#";
      $("signin").hidden = session.signed_in || joinNeeded;
      $("signout").hidden = !session.signed_in;
      $("signedOut").hidden = session.signed_in || joinNeeded;
      $("joinNeeded").hidden = !joinNeeded;
      $("app").hidden = !session.signed_in;
      if (!session.signed_in) {
        state.stopWatch?.();
        Object.assign(state, { community: null, channel: null, thread: null, stopWatch: null });
        $("live").textContent = "";
        return;
      }
      state.community = await polynet.community();
      $("title").textContent = state.community.name;
      document.title = state.community.name;
      $("askAgent").title = `Ask the ${state.community.name} agent`;
      await loadChannels();
    }

    // Files upload first; the post claims them.
    async function send({ input, fileInput, status, replyTo }) {
      const text = input.value.trim();
      const files = [...fileInput.files];
      if (!text && !files.length) return;
      status.textContent = files.length ? "Uploading…" : "";
      const askAgent = state.askAgent && !replyTo;
      try {
        await polynet.post(state.channel.slug, text, { files, replyTo, askAgent });
        input.value = "";
        fileInput.value = "";
        state.askAgent = false;
        $("askAgent").classList.remove("mine");
      } catch (error) {
        fail(error);
        status.textContent = error.message;
        return;
      }
      status.textContent = "";
    }

    $("askAgent").onclick = () => {
      state.askAgent = !state.askAgent;
      $("askAgent").classList.toggle("mine", state.askAgent);
      $("text").focus();
    };
    $("composer").onsubmit = (event) => {
      event.preventDefault();
      send({ input: $("text"), fileInput: $("files"), status: $("pending") });
    };
    $("replyComposer").onsubmit = (event) => {
      event.preventDefault();
      if (state.thread) send({ input: $("replyText"), fileInput: $("replyFiles"), status: $("replyPending"), replyTo: state.thread.ref });
    };
    $("closeThread").onclick = closeThread;
    $("signin").onclick = () => polynet.signIn("/");
    $("signout").onclick = async () => { await polynet.signOut(); refresh(); };
    for (const link of document.querySelectorAll('a[href^="/__polynet/auth/start"]')) {
      link.onclick = (event) => { event.preventDefault(); polynet.signIn("/"); };
    }

    refresh().catch(fail);
  </script>
