app = "polynet-codex-worker-staging"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  POLYNET_DEPLOYMENT_KIND = "staging"
  CONVEX_DEPLOYMENT = "dev:quick-porcupine-949"
  POLYNET_WORKSPACE_COMPUTER_PROVIDER = "blaxel"
  POLYNET_ENABLE_BLAXEL_WORKSPACE_PROVIDER = "true"
  POLYNET_CODEX_WORKER_HOST = "0.0.0.0"
  POLYNET_CODEX_WORKER_CODEX_BIN = "codex"
  POLYNET_CODEX_WORKER_MODEL = "gpt-5.5"
  POLYNET_CODEX_WORKER_COMMAND_TIMEOUT_SECONDS = "60"
  CODEX_HOME = "/data/codex-home"
  BLAXEL_WORKSPACE_REGION = "us-pdx-1"
  BLAXEL_WORKSPACE_MEMORY_MB = "2048"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # soft_limit 1: a machine running one turn is "full", so fly-proxy routes
    # new turns to idle machines and autostarts suspended pool members.
    # hard_limit stays high so pinned cancel/probe requests still reach a
    # busy machine and hit the app-level guard instead of proxy queueing.
    soft_limit = 1
    hard_limit = 16

  [[http_service.checks]]
    grace_period = "45s"
    interval = "20s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[vm]
  cpu_kind = "shared"
  # The worker is a single-flight I/O-bound broker (model and execution are
  # remote): measured 142MB peak under a live turn. One shared CPU and 1GB
  # keep it far under Fly's 2GB suspend ceiling, and smaller memory restores
  # faster from suspend (resume scales with RAM image size).
  cpus = 1
  memory_mb = 1024
